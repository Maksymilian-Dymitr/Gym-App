services:
  backend:
    build: ./Backend
    ports:
      - "3001:3001"
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/gym-postgres
    depends_on:
      - database

  frontend:
    build: ./Frontend
    ports:
      - "3000:3000"

  database:
    image: postgres:15-alpine
    container_name: hercules-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gym-postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym-postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
